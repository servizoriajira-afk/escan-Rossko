function whyWeak(s){
  const w=[];
  if(s.asp[0]!=null && s.asp[0]<.8) w.push(`«Персонал» ${pct(s.asp[0])}`);
  const lowA = s.asp.map((v,i)=>[v,i]).filter(([v,i])=>v!=null&&v<.8&&i>0).map(([v,i])=>`«${ASP[i]}» ${pct(v)}`); w.push(...lowA);
  if(s.silent>.45) w.push(`${pct(s.silent)} оценок без текста`);
  if(s.neg) w.push(`${s.neg} негативных из ${s.sample}`);
  return w.join(" · ") || s.compl;
}

// tooltip
const TIP = document.createElement("div"); TIP.className = "tip"; TIP.hidden = true; document.body.appendChild(TIP);
function moveTip(e){
  const t = e.target.closest && e.target.closest("[data-tip]");
  if(!t){ TIP.hidden = true; return; }
  TIP.innerHTML = t.dataset.tip; TIP.hidden = false;
  const r = TIP.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if(x + r.width > innerWidth - 8) x = Math.max(8, e.clientX - r.width - 14);
  if(y + r.height > innerHeight - 8) y = Math.max(8, e.clientY - r.height - 14);
  TIP.style.left = x + "px"; TIP.style.top = y + "px";
}
document.addEventListener("pointermove", moveTip);
document.addEventListener("pointerdown", moveTip);
document.addEventListener("scroll", () => TIP.hidden = true, true);

}

function dotRows(rows, {min, max, ticks, fmt, refs=[]}){
  const x = v => Math.max(0, Math.min(100, (v-min)/(max-min)*100));
  const grid = ticks.map(t=>`<s style="left:${x(t)}%"></s>`).join("");
  return `<div class="rows dots">${rows.map(r=>`<div class="row ${r.store?"clk":""}" ${r.store?`data-store="${r.store}"`:""}><span class="rl">${r.label}</span><span class="dt">${grid}${refs.map(f=>`<u style="left:${x(f.v)}%" ${tip(f.tip)}></u>`).join("")}${r.range?`<b class="rg" style="left:${x(r.range[0])}%;width:${x(r.range[1])-x(r.range[0])}%"></b>`:""}${r.dots.map(d=>`<i class="${d.cls||""}" style="left:${x(d.v)}%;${d.color?`background:${d.color}`:""}" ${tip(d.tip)}></i>`).join("")}</span><span class="rv2">${r.val??""}</span></div>`).join("")}
  <div class="row axis"><span></span><span class="dt">${ticks.map(t=>`<em style="left:${x(t)}%">${fmt(t)}</em>`).join("")}</span><span></span></div></div>`;
}
function barRows(rows, {max, fmt, ref}){
  return `<div class="rows">${rows.map(r=>`<div class="row ${r.store?"clk":""}" ${r.store?`data-store="${r.store}"`:""}><span class="rl">${r.label}</span><span class="bt">${ref!=null?`<u style="left:${ref/max*100}%"></u>`:""}<i style="width:${r.v/max*100}%;background:${r.color||"var(--ink)"}" ${tip(r.tip)}></i></span><span class="rv2">${fmt(r.v)}</span></div>`).join("")}</div>`;
}

// SVG: scatter rating × silent share
function scatterSvg(list){
  return w => {
    const h = 300, m = {l:40, r:14, t:16, b:40};
    const X = v => m.l + v/0.65*(w-m.l-m.r), Y = v => m.t + (5.05-v)/0.55*(h-m.t-m.b);
    let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Рейтинг Яндекса и доля оценок без текста">`;
    [4.5,4.6,4.7,4.8,4.9,5.0].forEach(t => s += `<line x1="${m.l}" x2="${w-m.r}" y1="${Y(t)}" y2="${Y(t)}" class="${t===4.8?"gl ref":"gl"}"/><text x="${m.l-8}" y="${Y(t)+4}" text-anchor="end" class="ax">${num(t,1)}</text>`);
    s += `<text x="${m.l+4}" y="${Y(4.8)-6}" class="ax">порог 4,8</text>`;
    [0,.2,.4,.6].forEach(t => s += `<line x1="${X(t)}" x2="${X(t)}" y1="${h-m.b}" y2="${h-m.b+4}" class="gl"/><text x="${X(t)}" y="${h-m.b+18}" text-anchor="middle" class="ax">${pct(t)}</text>`);
    s += `<text x="${w-m.r}" y="${h-4}" text-anchor="end" class="ax">доля оценок без текста →</text>`;
    [...list].sort((a,b)=>b.yn-a.yn).forEach(st => {
      const r = 4 + Math.sqrt(st.yn)/2.3;
      s += `<circle cx="${X(st.silent)}" cy="${Y(st.yr)}" r="${r}" fill="${GC[st.grp]}" class="pt" data-store="${st.id}" ${tip(`<b>${esc(sname(st))}</b><br>Рейтинг ${num(st.yr,1)} · ${st.yn} оценок<br>Без текста: ${pct(st.silent)}<br>Негатив в выборке: ${pct(st.negs)}`)}/>`;
      if(st.yr < 4.7) s += `<text x="${X(st.silent)}" y="${Y(st.yr)-r-5}" text-anchor="middle" class="ax lbl">${esc(st.addr.split(",")[0].replace(/^(ул\.|пр-т)\s*/,""))}</text>`;
    });
    return s + `</svg>`;
  };
}
// SVG: stacked columns of negative reviews by quarter
function quarterData(reviews){
  const Q = []; for(const y of [2025,2026]) for(let q=0;q<4;q++) Q.push({y,q,label:["I","II","III","IV"][q]+" кв. "+String(y).slice(2),vals:Object.fromEntries(GROUPS.map(g=>[g,0]))});
  let undated = 0;
  reviews.forEach(r => { if(!r.d){ undated++; return; } const dt=new Date(r.d); const o=Q.find(o=>o.y===dt.getFullYear()&&o.q===Math.floor(dt.getMonth()/3)); if(o) o.vals[r.grp]++; });
  return {Q, undated};
}
function columnsSvg(Q, groups){
  return w => {
    const h = 240, m = {l:28, r:8, t:18, b:36};
    const tot = Q.map(o=>groups.reduce((a,g)=>a+o.vals[g],0)), max = Math.max(4, Math.ceil(Math.max(...tot)/2)*2);
    const bw = (w-m.l-m.r)/Q.length, Y = v => m.t + (1-v/max)*(h-m.t-m.b), H = v => v/max*(h-m.t-m.b);
    let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Негативные отзывы по кварталам">`;
    for(let t=0;t<=max;t+=max>8?4:2) s += `<line x1="${m.l}" x2="${w-m.r}" y1="${Y(t)}" y2="${Y(t)}" class="gl"/><text x="${m.l-6}" y="${Y(t)+4}" text-anchor="end" class="ax">${t}</text>`;
    Q.forEach((o,i) => {
      const x = m.l + i*bw + bw*0.2, cw = bw*0.6; let acc = 0;
      groups.forEach(g => { const v = o.vals[g]; if(!v) return; const y = Y(acc+v), hh = H(v)-2; acc += v;
        s += `<rect x="${x}" y="${y}" width="${cw}" height="${Math.max(1,hh)}" rx="${acc===tot[i]?3:0}" fill="${GC[g]}" ${tip(`<b>${o.label}</b><br>${g}: ${v}<br>Всего за квартал: ${tot[i]}`)}/>`; });
      if(tot[i]) s += `<text x="${x+cw/2}" y="${Y(tot[i])-5}" text-anchor="middle" class="ax val">${tot[i]}</text>`;
      s += `<text x="${x+cw/2}" y="${h-m.b+15}" text-anchor="middle" class="ax">${o.label.split(" кв. ")[0]}${bw>70?" кв.":""}</text>`;
      if(o.q===0) s += `<text x="${x+cw/2}" y="${h-m.b+29}" text-anchor="middle" class="ax">${o.y}</text>`;
    });
    return s + `</svg>`;
  };
}

    <div class="kv"><h4>Ключевые жалобы</h4><p>${esc(s.compl)}</p></div>
    ${s.flags&&s.flags!=="—"?`<div class="flag"><b>Риск-флаг карточки.</b> ${esc(s.flags)}</div>`:""}
    <div class="panel"><div class="ph">Негативные отзывы · ${s.reviews.length}</div><div class="feed">${s.reviews.map(reviewRow).join("")||'<div class="empty">В выборке негатива нет.</div>'}</div></div>
    <a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener" style="text-decoration:none;align-self:flex-start">Отзывы на Яндекс Картах ↗</a>
  </div>`);
}
const REPLY = [
  "Нам жаль, что подбор оказался неточным. Мы разобрали ситуацию с сотрудниками магазина и проверили, где произошла ошибка при подборе по VIN.",
  "Мы проверили расхождение между наличием на сайте и в магазине и передали случай в отдел, который отвечает за синхронизацию остатков.",
  "Приносим извинения за задержку заказа. Мы выяснили причину и усилили контроль сроков и сборки в этом магазине.",
  "Нам жаль, что пришлось ждать. Мы пересматриваем график смен, чтобы в часы пик в зале работало больше сотрудников.",
  "Такое общение не соответствует нашим стандартам. Управляющий магазина уже разбирает ситуацию с сотрудником.",
  "Мы хотим помочь с возвратом. Пожалуйста, напишите нам номер заказа — управляющий свяжется с вами и оформит возврат.",
  "Спасибо, что сообщили о цене. Мы проверили ценники и порядок их обновления в магазине.",
  "Нам жаль, что товар оказался некачественным. Мы оформим замену или возврат и передадим информацию поставщику.",
  "Спасибо за замечание об условиях в магазине. Мы передали его службе эксплуатации.",
];
function openReply(i){
  const r = D.reviews[i];
  const text = `Здравствуйте! Спасибо, что написали нам.\n\n${r.t.map(t=>REPLY[t]).filter((v,k,a)=>a.indexOf(v)===k).join(" ")}\n\nЕсли вопрос ещё не решён, позвоните в магазин ROSSKO на ${r.addr} — мы поможем.\n\nКоманда ROSSKO`;
  sheet(`<div class="sh-top"><div><h3>Ответ на отзыв</h3><p>${esc(SHORT[r.city]||r.city)}, ${esc(r.addr)} · ${esc(r.date)}</p></div><button class="btn" data-close>Закрыть</button></div>
  <div class="sh-body">
    <div class="panel"><div class="pb" style="display:flex;flex-direction:column;gap:8px"><div>${esc(r.text)}</div><div class="tags" style="display:flex;gap:5px;flex-wrap:wrap">${r.t.map(t=>`<span class="tag">${TS[t]}</span>`).join("")}</div></div></div>
    <label for="rtext" class="note">Черновик по темам жалобы, отредактируйте перед публикацией</label>
    <textarea id="rtext">${esc(text)}</textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="btn pri" data-copy>Скопировать ответ</button>
      <label class="note" for="rst">Статус</label>
      <select class="st" id="rst">${Object.entries(STL).map(([k,l])=>`<option value="${k}" ${status(r)===k?"selected":""}>${l}</option>`).join("")}</select>
    </div>
    ${r.store?`<button class="btn" data-store="${r.store.id}" style="align-self:flex-start">Открыть магазин</button>`:""}
  </div>`);
  $("#rst").onchange = e => { setStatus(i,e.target.value); toast("Статус: "+STL[e.target.value]); route(); };
  $("[data-copy]").onclick = () => { const t=$("#rtext"); navigator.clipboard?.writeText(t.value).then(()=>toast("Ответ скопирован"),()=>{t.select();toast("Выделено, нажмите Ctrl+C")}) ?? (t.select(),toast("Выделено, нажмите Ctrl+C")); };
}
function sheet(html){
  $("#layer").innerHTML = `<div class="scrim" data-close></div><aside class="sheet" role="dialog" aria-modal="true">${html}</aside>`;
  drawCharts($("#layer"));
  $("#layer").querySelector(".sheet [data-close]")?.focus();
}
const closeSheet = () => $("#layer").innerHTML = "";
let tt; function toast(m){ clearTimeout(tt); document.querySelector(".toast")?.remove(); const d=document.createElement("div"); d.className="toast"; d.textContent=m; document.body.appendChild(d); tt=setTimeout(()=>d.remove(),1800); }

// ---------- events ----------
document.addEventListener("click", e => {
  const t = e.target.closest("[data-close],[data-store],[data-reply],[data-go],[data-group],[data-topic],[data-cell],[data-chip],[data-sort],[data-ast],[data-ag2]");
  if(!t) return;
  const d = t.dataset;
  if("close" in d) return closeSheet();
  if(d.reply!=null) return openReply(+d.reply);
  if(d.store) return openStore(d.store);
  if(d.go) return go(d.go);
  if(d.group){ UI.group=d.group; saveUI(); return go("stores"); }
  if(d.topic!=null){ UI.aTopic=+d.topic; UI.aStatus="all"; UI.aGroup="Все"; return go("alerts"); }
  if(d.cell){ const [i,g]=d.cell.split("|"); UI.aTopic=+i; UI.aGroup=g; UI.aStatus="all"; return go("alerts"); }
  if(d.chip){ UI.group=d.chip; saveUI(); return route(); }
  if(d.ag2){ UI.ag2=d.ag2; return route(); }
  if(d.ast){ UI.aStatus=d.ast; return route(); }
  if(d.sort){ UI.dir = UI.sort===d.sort ? -UI.dir : (["yr","a0","a1","a2","a3","a4","gr","ans"].includes(d.sort)?1:-1); UI.sort=d.sort; saveUI(); return route(); }
});
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });
function bind(v){
  if(v==="stores"){ const q=$("#q"); q.oninput = () => { UI.q=q.value; const p=q.selectionStart; route(); const n=$("#q"); n.focus(); n.setSelectionRange(p,p); }; }
  if(v==="alerts"){ $("#ag").onchange=e=>{UI.aGroup=e.target.value;route()}; $("#at").onchange=e=>{UI.aTopic=e.target.value===""?null:+e.target.value;route()}; }
}
route();
</script>

</body></html>
